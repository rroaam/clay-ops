name: test

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - review/ci-pytest-2026-08-31

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: uv sync --extra test

      - name: Run pytest
        run: uv run pytest
